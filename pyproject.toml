[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultimate-os"
version = "1.0.0"
description = "Tri-Anchor Personal AI Operating System uniting a Windows DPAPI Enclave, Screenshot-Free Laptop and Phone Control, Phone-as-Wireless-Microphone Voice Assistant, and Zero-Internet Offline Communication Modes"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Soumya Ranjan Nanda"},
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
    "psutil>=5.9",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "pillow>=10.0",
    "qrcode>=7.4",
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ultimate = "ultimate.cli:main"

[project.urls]
Homepage = "https://github.com/SRN0129/ultimate"
Repository = "https://github.com/SRN0129/ultimate"
Issues = "https://github.com/SRN0129/ultimate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ultimate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
